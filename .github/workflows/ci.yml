name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gestion_fabrica_testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: gestion_fabrica_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit PHP dependencies
        run: composer audit --locked
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit runtime frontend dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        run: npm run build
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: Syntax check application PHP
        run: find app routes database tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run migrations
        run: php artisan migrate:fresh --force
      - name: Validate routes and views
        run: |
          php artisan route:list
          php artisan view:cache
      - name: Critical security and vending tests
        run: php artisan test tests/Feature/SecurityAndPermissionsTest.php tests/Feature/InventorySecurityTest.php tests/Feature/VendingFlowTest.php
      - name: Full test suite
        run: php artisan test
