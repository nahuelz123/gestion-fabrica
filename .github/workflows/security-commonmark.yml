name: Security dependency fix

on:
  push:
    paths:
      - '.github/workflows/security-commonmark.yml'

permissions:
  contents: write

jobs:
  update-commonmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          tools: composer:v2

      - name: Update patched CommonMark
        run: composer update league/commonmark --with-dependencies --no-interaction --no-progress

      - name: Verify dependency audit
        run: composer audit --locked

      - name: Commit lockfile
        run: |
          if git diff --quiet composer.lock; then
            echo "composer.lock already uses a patched version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Actualizar CommonMark por avisos de seguridad"
          git push
